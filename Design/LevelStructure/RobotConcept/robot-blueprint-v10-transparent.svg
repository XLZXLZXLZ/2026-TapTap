<title>Robot architectural section — actual level walls and platforms</title>
<desc>Orthographic XY section extracted from the real 1–20 source level placements. No visible text. Wall tiles are merged without changing their positions; thin platforms use their authored 0.25-cell thickness. The robot outline retains its antenna, side tabs, four corner flanges and feet. This first structural study omits mechanisms, characters and material textures.</desc>
